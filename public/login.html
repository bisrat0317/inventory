<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEDEBER - Shop &amp; Inventory System</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg">
    <!-- Modern Typography (Inter & Noto Sans Ethiopic for Amharic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 15% 15%, rgba(44, 123, 229, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
                        var(--bg-primary);
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card-wrapper {
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.4s ease-out;
        }

        .login-glass-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 36px 40px;
            box-shadow: var(--shadow-xl);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
        }

        .login-top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 8px;
            }
            .login-glass-card {
                padding: 24px 16px;
                border-radius: var(--radius-lg);
            }
            .brand-header {
                margin-bottom: 24px;
            }
            .brand-header h1 {
                font-size: 20px;
            }
            .brand-logo-icon {
                width: 44px;
                height: 44px;
                font-size: 22px;
                border-radius: 12px;
            }
            .role-chip {
                padding: 6px 10px;
                font-size: 11.5px;
            }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 8px 20px -4px rgba(44, 123, 229, 0.35);
            margin-bottom: 16px;
        }

        .brand-header h1 {
            font-family: 'Outfit', 'Noto Sans Ethiopic', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .brand-header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            width: 18px;
            height: 18px;
        }

        .form-input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14.5px;
            font-family: inherit;
            color: var(--text-primary);
            transition: all var(--transition-fast);
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(44, 123, 229, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #1a66cc);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 14px rgba(44, 123, 229, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(44, 123, 229, 0.4);
            background: linear-gradient(135deg, #256ecc, #155bb5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .quick-roles-container {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            text-align: center;
        }

        .quick-roles-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .quick-chips {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .role-chip {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .role-chip:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .error-alert {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Rebi Techs Brand Credit & Support Footer */
        .rebi-footer {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .rebi-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(13, 27, 68, 0.05);
            border: 1px solid rgba(13, 27, 68, 0.1);
            transition: all 0.2s ease;
        }

        [data-theme="dark"] .rebi-badge {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .rebi-badge span {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .rebi-badge strong {
            font-weight: 700;
            color: var(--text-primary);
        }

        .rebi-contacts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            font-size: 11px;
        }

        .rebi-contact-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .rebi-contact-item:hover {
            color: #00A8A8;
        }

        .rebi-contact-item svg {
            width: 13px;
            height: 13px;
            opacity: 0.85;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="login-card-wrapper">
    <div class="login-glass-card">
        <div class="login-top-bar">
            <div class="lang-switch-container" style="background:var(--bg-secondary); border-color:var(--border-color);">
                <button type="button" class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
                <button type="button" class="lang-btn" data-lang="am" onclick="setLanguage('am')">አማ</button>
            </div>
        </div>

        <div class="brand-header">
            <div style="display:flex; justify-content:center; margin-bottom:14px;">
                <img src="/assets/logo.svg" alt="MEDEBER Logo" style="height:76px; width:auto; max-width:100%; object-fit:contain; filter:drop-shadow(0 4px 12px rgba(229,169,60,0.25));">
            </div>
            <h1 data-i18n="login.heading" style="color:var(--text-primary); font-size:24px; font-weight:800; letter-spacing:0.5px; margin:0 0 4px 0;">MEDEBER</h1>
            <p data-i18n="login.subheading" style="color:var(--text-secondary); font-size:13.5px; margin:0 0 6px 0;">Shop &amp; Inventory System</p>
            <div style="display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); font-weight:600; letter-spacing:0.3px;">
                <span>by</span>
                <img src="/assets/rebi-icon.png" alt="Rebi Techs" style="height:14px; width:auto; border-radius:2px; vertical-align:middle;">
                <span style="color:#00A8A8; font-weight:700;">Rebi Techs</span>
            </div>
        </div>

        <div class="error-alert" id="loginErrorMessage"></div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label for="usernameInput" data-i18n="login.username_label">Username</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="text" id="usernameInput" class="form-input" placeholder="Enter username" data-i18n-placeholder="login.username_placeholder" autocomplete="username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="passwordInput" data-i18n="login.password_label">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" data-i18n-placeholder="login.password_placeholder" autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginSubmitBtn">
                <span data-i18n="login.submit_btn">Sign In to System</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>

        <div class="quick-roles-container">
            <div class="quick-roles-label" data-i18n="login.quick_roles">Quick Sign-In (Preloaded Test Roles)</div>
            <div class="quick-chips">
                <button type="button" class="role-chip" onclick="fillCredentials('admin', 'admin123')">
                    👑 Admin
                </button>
                <button type="button" class="role-chip" onclick="fillCredentials('manager', 'admin123')">
                    ⚡ Manager
                </button>
                <button type="button" class="role-chip" onclick="fillCredentials('staff', 'admin123')">
                    📦 Staff
                </button>
            </div>
        </div>

        <!-- Rebi Techs Brand & Support Footer -->
        <div class="rebi-footer">
            <div class="rebi-badge">
                <span>Developed by</span>
                <img src="/assets/rebi-logo.png" alt="Rebi Techs (ረቢ techs)" style="height:18px; width:auto; display:inline-block; vertical-align:middle;">
            </div>
            <div class="rebi-contacts">
                <a href="mailto:bisratmulatu00@gmail.com" class="rebi-contact-item" title="Support Email">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <span>bisratmulatu00@gmail.com</span>
                </a>
                <a href="tel:+251976555989" class="rebi-contact-item" title="Call Technical Support">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    <span>+251 976 555 989</span>
                </a>
                <a href="https://t.me/bisre_12" target="_blank" rel="noopener noreferrer" class="rebi-contact-item" title="Telegram Contact">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    <span>@bisre_12</span>
                </a>
            </div>
        </div>
    </div>
</div>

<script src="/js/i18n.js"></script>
<script>
async function checkCurrentSession() {
    try {
        const res = await fetch('/api/auth/session');
        const data = await res.json();
        if (data.success && data.user) {
            window.location.href = '/index.html';
        }
    } catch (e) {}
}
checkCurrentSession();

function fillCredentials(user, pass) {
    document.getElementById('usernameInput').value = user;
    document.getElementById('passwordInput').value = pass;
    document.getElementById('loginErrorMessage').style.display = 'none';
}

async function handleLoginSubmit(event) {
    event.preventDefault();
    const submitBtn = document.getElementById('loginSubmitBtn');
    const errorBox = document.getElementById('loginErrorMessage');
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span>${typeof t === 'function' ? t('login.verifying', 'Verifying credentials...') : 'Verifying credentials...'}</span>`;

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
            window.location.href = '/index.html';
        } else {
            errorBox.textContent = data.message || (typeof t === 'function' ? t('login.invalid_error', 'Invalid username or password.') : 'Invalid username or password.');
            errorBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>${typeof t === 'function' ? t('login.submit_btn', 'Sign In to System') : 'Sign In to System'}</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
        }
    } catch (err) {
        errorBox.textContent = typeof t === 'function' ? t('login.network_error', 'Network or server error.') : 'Network or server error.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>${typeof t === 'function' ? t('login.submit_btn', 'Sign In to System') : 'Sign In to System'}</span>`;
    }
}
</script>

</body>
</html>
