<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <style>
      .logo-icon-stroke {
        stroke: #E5A93C;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .logo-icon-fill {
        fill: #E5A93C;
      }
    </style>
  </defs>

  <!-- Top Left Box / Shelf Frame -->
  <path class="logo-icon-stroke" d="M 32 40 L 92 40 L 92 98" />
  <path class="logo-icon-stroke" d="M 32 40 L 32 95" />
  <!-- Box slot / handle -->
