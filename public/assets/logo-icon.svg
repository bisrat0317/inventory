  <!-- Bottom Right Box Frame -->
  <path class="logo-icon-stroke" d="M 74 105 L 74 136 L 138 136 L 138 92" />

  <!-- Rising Chart Growth Arrow -->
  <path class="logo-icon-stroke" d="M 28 126 L 72 82 L 96 104 L 140 46" stroke-width="10" />
  <!-- Arrow Head -->
